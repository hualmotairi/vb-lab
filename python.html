 my phone. My phone is new.'\nnew_text = old_text.....(...., 'tablet')\nprint(new_text)\n","Q13.py":"# أكمل الفراغات ........ فقط، ولا تغيّر بقية الكود\n# أ) أكمل شرطًا بسيطًا يطبع 'Adult' إذا كان العمر var_age أكبر من أو يساوي 18\nvar_age = int(input('Enter your age: '))\nif var_age .... 18:\n    print('Adult')\n\n\n# ب) أكمل شرطًا بديلًا if-else يطبع 'Successful' إذا كانت الدرجة 50 فأكثر وإلا يطبع 'Unsuccessful'\nscore = float(input('Enter exam score: '))\nif score .... ....:\n    print('Successful')\n....:\n    print('Unsuccessful')\n\n\n# ج) أكمل شرطًا بديلًا يطبع 'Positive' إذا كان العدد var_num أكبر من صفر وإلا يطبع 'Not positive'\nvar_num = int(input('Enter a number: '))\nif var_num .... 0:\n    print('Positive')\n....:\n    print('Not positive')\n","Q14.py":"# أكمل الفراغات ........ فقط، ولا تغيّر بقية الكود\n# أ) أكمل شرطًا متداخلًا Nested if:\n#    إذا كان user_name يساوي 'student':\n#        إذا كانت user_password تساوي 'py2026' اطبع 'Welcome student!' وإلا اطبع 'Wrong password.'\n#    وإلا اطبع 'Unknown user.'\nuser_name = input('Enter user name: ')\nuser_password = input('Enter password: ')\nif user_name == 'student':\n    if user_password .... 'py2026':\n        print('Welcome student!')\n    ....:\n        print('Wrong password.')\nelse:\n    print('Unknown user.')\n\n\n# ب) أكمل شرطًا متسلسلًا if-elif-else مستخدمًا العامل المنطقي and:\n#    من 90 إلى 100      -> 'A'\n#    من 75 إلى أقل من 90 -> 'B'\n#    من 50 إلى أقل من 75 -> 'C'\n#    غير ذلك            -> 'F'\nstudent_score = float(input('Enter student score: '))\nif student_score >= 90 .... student_score <= 100:\n    print('A')\n.... student_score >= 75 and student_score < 90:\n    print('B')\nelif student_score >= 50 and student_score .... 75:\n    print('C')\n....:\n    print('F')\n","Q15.py":"# أكمل الفراغات ........ فقط، ولا تغيّر بقية الكود\n# أ) استخدم الحلقة التكرارية while لطباعة الأعداد من 1 إلى 7\nx = 1\nwhile x .... 7:\n    print(x)\n    x = x + 1\n\n\n# ب) استخدم while True مع التعليم
