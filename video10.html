<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>فيديو شرح مشروع Python – الصف العاشر</title>
<style>
:root{color-scheme:light;--navy:#17345F;--steel:#2F5C94;--line:#9DB2CC;--paper:#FBFCFE;--ink:#14233A;--soft:#4C5D75;--go:#D9480F;--bg:#EEF3FA}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(20px,4vw,28px)}header a{color:#fff;font-weight:600}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
video{width:100%;max-height:72dvh;background:#000;display:block}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--soft)}
.bar button{border:1px solid var(--steel);background:#fff;color:var(--navy);padding:5px 12px;font:600 14px Tahoma,Arial,sans-serif;cursor:pointer}.bar button.on{background:var(--go);border-color:var(--go);color:#fff}
.ch{background:var(--paper);border:1px solid var(--line);max-height:72dvh;overflow:auto}
.ch h2{margin:0;font-size:16px;padding:8px 12px;background:#E3EAF3;position:sticky;top:0}
.ch button{display:flex;gap:8px;width:100%;text-align:right;border:0;border-top:1px solid #E2E7EE;background:none;padding:8px 12px;font:14px/1.5 inherit;font-family:inherit;color:inherit;cursor:pointer}
.ch button:hover{background:#FFF2C8}.ch button.on{background:#FFE3D3;font-weight:700}.ch b{color:var(--go);flex:none;min-width:30px}
.fine{margin:0;font-size:13.5px;color:var(--soft);line-height:1.7}
@media (max-width:820px),(orientation:landscape) and (max-height:520px){.wrap{grid-template-columns:minmax(0,1fr)}.ch{max-height:none}video{max-height:78dvh}}
</style>
</head>
<body>
<main>
<header><h1>فيديو شرح مشروع Python – الصف العاشر</h1><a href="python.html">ارجع إلى المختبر</a></header>
<div class="wrap">
<section>
<video id="v" src="tutorial10.mp4" controls playsinline preload="metadata"></video>
<div class="bar">السرعة:<button data-r="1">1×</button><button data-r="1.5">1.5×</button><button data-r="2">2×</button></div>
</section>
<nav class="ch" aria-label="أسئلة المشروع"><h2>اختر الجزء</h2><div id="list"></div></nav>
</div>
<p class="fine">يعرض الفيديو الحل كما يظهر في المختبر: تقرأ السؤال، تضغط الإجابة في الفقاعة فتُكتب في الكود، ثم تقرأ الفكرة وما قد يتغير في الاختبار.</p>
</main>
<script>
(function(){
var Q=["أنشئ المتغير my_name بالقيمة Ali ثم اطبعه", "اطبع نوع بيانات المتغير my_salary باستخدام الدالة type()", "اطبع ناتج القسمة الصحيحة للمتغير num_1 على المتغير num_2", "استقبل اسم المستخدم في المتغير name باستخدام الدالة input()", "حوّل قيمة num_a المُدخلة إلى عدد صحيح، ثم اطبع المجموع", "اطبع الحرف الأخير من المتغير var_x باستخدام الفهرسة السالبة", "اطبع الاسم الأوسط Hammoud من المتغير var_name باستخدام القطع", "اربط السلسلتين باستخدام عملية الجمع لطباعة Liberation Day: 26 Feb", "اطبع رقم فهرس أول ظهور للكلمة Kuwait في var_text باستخدام find()", "حوّل جميع أحرف var_message إلى أحرف كبيرة ثم اطبعها", "استخدم f-string لطباعة Name: Ahmad and Age: 16", "استبدل الكلمة device بالكلمة computer باستخدام replace() ثم اطبع النص الجديد", "أكمل شرط if للتحقق مما إذا كان العدد var_num زوجياً", "أكمل سطر elif لطباعة Good grade إذا كانت الدرجة من 70 إلى أقل من 90", "اخرج من الحلقة عند إدخال كلمة المرور الصحيحة a1234", "تجاوز الأعداد الفردية واستمر في الحلقة، لطباعة الأعداد الزوجية فقط", "أكمل شرط حلقة while الداخلية لتكرار current_student من 1 إلى 3", "أكمل حلقة for الداخلية لتكرار كل مقعد airplane_seat في airplane_seats", "صحح الخطأ في الكود", "أكمل معالجة الخطأ عند إدخال قيمة غير رقمية", "احفظ التغييرات (Save All)", "الحل بدون مساعدة: الاختيارات والتنبيه عند الخطأ"];
var T=[4.95, 41.35, 80.65, 124.5, 162.45, 201.75, 238.95, 276.1, 313.65, 351.95, 390.25, 436.6, 471.55, 518.9, 570.05, 605.45, 643.4, 689.1, 729.3, 766.15, 803.75, 825.1];
var L=["س1", "س2", "س3", "س4", "س5", "س6", "س7", "س8", "س9", "س10", "س11", "س12", "س13", "س14", "س15", "س16", "س17", "س18", "س19", "س20", "حفظ", "تدريب"];var v=document.getElementById("v"),list=document.getElementById("list");
list.innerHTML=Q.map(function(q,i){return '<button data-i="'+i+'"><b>'+L[i]+'</b><span>'+q+'</span></button>'}).join("");
list.onclick=function(e){var b=e.target.closest("button");if(!b)return;v.currentTime=T[+b.dataset.i]+0.05;v.play();window.scrollTo({top:0,behavior:"smooth"})};
var bs=document.querySelectorAll(".bar button");function rate(r){v.playbackRate=r;bs.forEach(function(b){b.classList.toggle("on",+b.dataset.r===r)})}
bs.forEach(function(b){b.onclick=function(){rate(+b.dataset.r)}});rate(1);
v.addEventListener("ratechange",function(){bs.forEach(function(b){b.classList.toggle("on",+b.dataset.r===v.playbackRate)})});
v.addEventListener("timeupdate",function(){var c=-1;for(var i=0;i<T.length;i++){if(v.currentTime>=T[i])c=i}list.querySelectorAll("button").forEach(function(b,i){b.classList.toggle("on",i===c)})});
})();
</script>
</body>
</html>
